<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WiFi Radar</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:#0a0e1a;color:#e2e8f0;min-height:100vh;
            display:flex;flex-direction:column;
        }
        .top-bar{
            padding:12px 16px;background:#111827;border-bottom:1px solid #1e3a5f;
            display:flex;align-items:center;justify-content:space-between;
        }
        .top-bar h1{font-size:1rem;color:#00d4ff;display:flex;align-items:center;gap:8px}
        .online-badge{font-size:0.7rem;color:#00ff88;padding:3px 8px;
            background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);border-radius:12px}

        .messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}

        .msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:0.9rem;line-height:1.4;
            animation:fadeIn 0.3s ease}
        .msg.in{align-self:flex-start;background:#1a2332;border:1px solid #1e3a5f;border-bottom-left-radius:4px}
        .msg.out{align-self:flex-end;background:rgba(0,255,136,0.12);border:1px solid rgba(0,255,136,0.3);border-bottom-right-radius:4px}
        .msg .who{font-size:0.65rem;color:#00d4ff;margin-bottom:3px;font-weight:700}
        .msg .when{font-size:0.6rem;color:#64748b;margin-top:3px;text-align:right}
        .msg.sys{align-self:center;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2);
            font-size:0.75rem;color:#a855f7;text-align:center;max-width:90%;border-radius:10px;padding:6px 14px}

        .input-bar{padding:10px 14px;background:#111827;border-top:1px solid #1e3a5f;display:flex;gap:8px}
        .input-bar input{flex:1;padding:10px 14px;background:#1a2332;border:1px solid #1e3a5f;
            border-radius:20px;color:#e2e8f0;font-size:0.95rem;outline:none}
        .input-bar input:focus{border-color:#00d4ff}
        .input-bar button{width:42px;height:42px;border-radius:50%;background:#00ff88;border:none;
            color:#000;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

        /* === TAM EKRAN BİLDİRİM === */
        .fullscreen-notif{
            display:none;position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.92);z-index:99999;
            flex-direction:column;align-items:center;justify-content:center;
            text-align:center;padding:30px;animation:notifIn 0.4s ease;
        }
        .fullscreen-notif.show{display:flex}
        .fullscreen-notif .notif-icon{font-size:4rem;margin-bottom:20px;animation:bounce 0.6s ease}
        .fullscreen-notif .notif-msg{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:12px;
            max-width:90%;word-break:break-word}
        .fullscreen-notif .notif-from{font-size:0.9rem;color:#00d4ff;margin-bottom:30px}
        .fullscreen-notif .notif-dismiss{padding:12px 30px;background:#00ff88;color:#000;
            border:none;border-radius:24px;font-size:1rem;font-weight:700;cursor:pointer}
        
        @keyframes notifIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        /* Banner (kısa mesajlar için) */
        .banner{
            display:none;position:fixed;top:0;left:0;right:0;z-index:9998;
            background:linear-gradient(135deg,#00d4ff,#00ff88);color:#000;
            padding:14px 20px;text-align:center;font-weight:700;font-size:1rem;
            box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideD 0.4s ease;
        }
        .banner.show{display:block}
        @keyframes slideD{from{transform:translateY(-100%)}to{transform:translateY(0)}}
    </style>
</head>
<body>
    <!-- Tam Ekran Bildirim -->
    <div class="fullscreen-notif" id="fullNotif">
        <div class="notif-icon">📡</div>
        <div class="notif-msg" id="notifMsg"></div>
        <div class="notif-from" id="notifFrom"></div>
        <button class="notif-dismiss" id="notifDismiss">Tamam</button>
    </div>

    <!-- Üst Banner -->
    <div class="banner" id="banner"></div>

    <div class="top-bar">
        <h1>📡 WiFi Radar</h1>
        <span class="online-badge" id="onlineBadge">Bağlanıyor...</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Mesaj yaz..." autocomplete="off">
        <button id="btnSend">➤</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
    const socket = io();
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('msgInput');

    // Kullanıcı kimliği
    let myId = localStorage.getItem('wr_id') || ('u_' + Math.random().toString(36).substr(2,8));
    localStorage.setItem('wr_id', myId);
    let myName = localStorage.getItem('wr_name');
    if (!myName) {
        myName = prompt('Adınızı girin:') || 'Anonim';
        localStorage.setItem('wr_name', myName);
    }

    // Bildirim izni
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // Bağlantı
    socket.on('connect', () => {
        socket.emit('chat_join', { id: myId, name: myName });
        document.getElementById('onlineBadge').textContent = 'Bağlandı ✓';
    });
    socket.on('disconnect', () => {
        document.getElementById('onlineBadge').textContent = 'Bağlantı kesildi';
    });
    socket.on('online_update', (d) => {
        document.getElementById('onlineBadge').textContent = d.count + ' çevrimiçi';
    });

    // Kullanıcı mesajı
    socket.on('chat_message', (d) => {
        const isMe = d.sender_id === myId;
        addMsg(d.sender_name, d.message, isMe ? 'out' : 'in', d.timestamp);
        if (!isMe) {
            showBanner(d.sender_name + ': ' + d.message);
            browserNotif(d.sender_name, d.message);
        }
    });

    // Sistem
    socket.on('chat_system', (d) => {
        const el = document.createElement('div');
        el.className = 'msg sys';
        el.textContent = d.message;
        messagesDiv.appendChild(el);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // ★ RADAR'DAN GELEN MESAJ - TAM EKRAN BİLDİRİM ★
    socket.on('admin_broadcast', (d) => {
        addMsg('📡 RADAR', d.message, 'in', d.timestamp);
        showFullscreenNotif(d.message);
        browserNotif('WiFi Radar', d.message);
        vibrate();
        playSound();
    });

    // Mesaj gönder
    function send() {
        const msg = input.value.trim();
        if (!msg) return;
        socket.emit('chat_send', { message: msg, sender_id: myId, sender_name: myName });
        input.value = '';
    }
    document.getElementById('btnSend').addEventListener('click', send);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });

    // UI
    function addMsg(who, text, dir, ts) {
        const el = document.createElement('div');
        el.className = 'msg ' + dir;
        const t = ts ? new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : '';
        el.innerHTML = (dir==='in' ? `<div class="who">${esc(who)}</div>` : '') +
            `<div>${esc(text)}</div><div class="when">${t}</div>`;
        messagesDiv.appendChild(el);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ★ TAM EKRAN BİLDİRİM ★
    function showFullscreenNotif(msg) {
        document.getElementById('notifMsg').textContent = msg;
        document.getElementById('notifFrom').textContent = 'WiFi Radar tarafından gönderildi';
        document.getElementById('fullNotif').classList.add('show');
        // 15sn sonra otomatik kapat
        setTimeout(dismissNotif, 15000);
    }
    function dismissNotif() {
        document.getElementById('fullNotif').classList.remove('show');
    }
    document.getElementById('notifDismiss').addEventListener('click', dismissNotif);

    // Banner
    function showBanner(text) {
        const b = document.getElementById('banner');
        b.textContent = text;
        b.classList.add('show');
        setTimeout(() => b.classList.remove('show'), 4000);
    }

    // Tarayıcı bildirimi
    function browserNotif(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body, icon: '📡', tag: 'wr-' + Date.now() });
        }
    }

    // Titreşim
    function vibrate() {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
    }

    // Ses
    function playSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.value = 0.3;
            osc.start();
            osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.1);
            osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.2);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.stop(ctx.currentTime + 0.4);
        } catch(e) {}
    }

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    </script>
</body>
</html>
